<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Musica">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Musica</title>
<style>
:root{--accent:#fa2d48;--bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--text:#fff;--text2:rgba(235,235,245,.6);--text3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.5);--fill:rgba(118,118,128,.24);--fill2:rgba(120,120,128,.36);--top:calc(env(safe-area-inset-top) + 58px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#000;color:var(--text);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
svg{display:block}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,textarea{-webkit-user-select:text;user-select:text}

/* vetro */
.glass{background:rgba(38,38,42,.56);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.24),inset 0 0 0 .5px rgba(255,255,255,.09),0 10px 34px rgba(0,0,0,.5)}

/* barra superiore */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:var(--top);padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.topbar::before{content:"";position:absolute;inset:0 0 -18px;background:linear-gradient(#000 0%,rgba(0,0,0,.82) 50%,rgba(0,0,0,0));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent);opacity:0;transition:opacity .25s;z-index:-1;pointer-events:none}
.topbar.scrolled::before{opacity:1}
.tt{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;max-width:50vw;text-align:center}
.topbar.scrolled .tt{opacity:1}
.tl{justify-self:start;display:flex;gap:8px}
.tr{justify-self:end;display:flex;gap:8px}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .15s}
.gbtn svg{width:22px;height:22px}
.gbtn.red{color:var(--accent)}
.gbtn:active{transform:scale(.9)}
main{padding-bottom:calc(210px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;min-height:100vh}
main.root{padding-top:calc(env(safe-area-inset-top) + 6px)}
main.push{padding-top:var(--top)}
main.hero{padding-top:0}
.large{font-size:34px;font-weight:700;line-height:44px;letter-spacing:.012em;padding:0 20px 10px}
main.root .large{padding-right:124px}

/* liste */
.navlist{padding-left:20px;margin:4px 0 4px}
.navrow{display:flex;align-items:center;gap:14px;width:100%;height:54px;position:relative;text-align:left}
.navrow::after{content:"";position:absolute;left:42px;right:0;bottom:0;height:.5px;background:var(--sep)}
.navrow:last-child::after{display:none}
.navrow .ni{color:var(--accent);width:28px;display:grid;place-items:center;flex:none}
.navrow .ni svg{width:25px;height:25px}
.navrow .nl{flex:1;font-size:20px}
.chev{color:var(--text3);padding-right:16px;flex:none}
.chev svg{width:17px;height:17px}
.list{padding-left:20px}
.list.abcpad{padding-right:20px}
.row{display:flex;align-items:center;gap:12px;min-height:60px;position:relative;cursor:pointer;padding-right:4px}
.row::after{content:"";position:absolute;left:var(--sl,60px);right:0;bottom:0;height:.5px;background:var(--sep)}
.row:last-child::after{display:none}
.row:active,.navrow:active,.tile:active .cover,.gitem.tap:active,.mcard:active,.gtile:active{opacity:.6}
.row .rt{flex:1;min-width:0;padding:8px 0}
.t1{font-size:16px}
.t2{font-size:14px;color:var(--text2);margin-top:1px}
.row.on .t1{color:var(--accent)}
.row.num{min-height:50px;--sl:38px}
.num-i{width:26px;text-align:center;color:var(--text2);font-size:15px;flex:none;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.num-i .eq{display:none;color:var(--accent)}
.row.on .num-i .n{display:none}
.row.on .num-i .eq{display:inline-flex}
.dur{color:var(--text2);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.fs{color:var(--accent);flex:none}
.fs svg{width:13px;height:13px}
.thumb{width:48px;height:48px;border-radius:7px;overflow:hidden;flex:none;position:relative;background:var(--fill)}
.thumb img,.cover img,.av img,.bigcover img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .eqw{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;color:#fff}
.row.on .thumb .eqw{display:grid}
.more{width:40px;height:40px;display:grid;place-items:center;color:var(--text2);flex:none;border-radius:50%}
.more svg{width:20px;height:20px}
.av{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none;background:var(--fill)}
.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(140deg,hsl(var(--h) 55% 52%),hsl(calc(var(--h) + 35) 50% 30%));color:rgba(255,255,255,.88)}
.ph svg{width:42%;height:42%}
.ph.ini{container-type:inline-size;background:linear-gradient(160deg,#8e8e93,#48484a)}
.ph.ini span{font-size:38cqw;font-weight:600;letter-spacing:.02em}
.ph.fav{background:linear-gradient(140deg,#ff6a7c,#fa2d48 55%,#b3122f)}
.ph.fav svg{width:46%;height:46%}
.lsec{font-size:15px;font-weight:600;color:var(--text2);padding:16px 0 6px;scroll-margin-top:calc(var(--top) + 4px)}
.rk{width:22px;text-align:center;font-weight:700;color:var(--text2);font-size:15px;flex:none}
.val{font-size:14px;color:var(--text2);white-space:nowrap;padding-right:12px}

/* sezioni, griglie */
.sec{font-size:22px;font-weight:700;padding:28px 20px 12px;letter-spacing:.01em;display:flex;align-items:center;gap:4px}
.sec button{display:flex;align-items:center;gap:2px}
.sec .chev{padding:0;color:var(--text2)}
.sec .chev svg{width:19px;height:19px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px;padding:0 20px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.g3{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{text-align:left;cursor:pointer;min-width:0}
.cover{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--fill);box-shadow:0 2px 10px rgba(0,0,0,.3)}
.cover.round{border-radius:50%}
.tile .a1{font-size:14px;margin-top:7px}
.tile .a2{font-size:14px;color:var(--text2)}
.tile.ctr{text-align:center}
.pins{padding-top:6px}
.pins .tile{text-align:center}
.pins .a1{font-size:13px;font-weight:600;margin-top:8px}
.pins .a2{display:none}
.pinhint{margin:8px 20px 6px;padding:14px 16px;border-radius:14px;background:var(--bg2);font-size:14px;color:var(--text2);display:flex;gap:12px;align-items:center}
.pinhint svg{width:22px;height:22px;color:var(--accent);flex:none}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:0 20px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:0 20px}
.hscroll::-webkit-scrollbar,.cards::-webkit-scrollbar,.cols::-webkit-scrollbar{display:none}
.hscroll .tile{flex:0 0 42%;max-width:190px;scroll-snap-align:start}
.hscroll .tile.ctr{flex-basis:31%;max-width:130px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px;width:14px}
.eq i{flex:1;background:currentColor;border-radius:1px;height:40%;animation:eq .9s ease-in-out infinite alternate;animation-play-state:paused}
.eq i:nth-child(2){height:100%;animation-delay:-.3s}.eq i:nth-child(3){height:65%;animation-delay:-.6s}
body.playing .eq i{animation-play-state:running}
@keyframes eq{0%{height:20%}100%{height:100%}}

/* home */
.cards{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:0 20px}
.mcard{flex:0 0 70%;max-width:290px;border-radius:18px;overflow:hidden;scroll-snap-align:start;background:var(--c);cursor:pointer;position:relative;text-align:left;color:#fff}
.mcard .mart{aspect-ratio:1;position:relative}
.mcard .mart::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,var(--c))}
.mcard .mtx{padding:0 16px 18px;margin-top:-34px;position:relative}
.mcard .k{font-size:12px;font-weight:700;letter-spacing:.07em;color:rgba(255,255,255,.72);text-transform:uppercase}
.mcard .h{font-size:24px;font-weight:800;line-height:1.12;margin-top:3px}
.mcard .s{font-size:14px;color:rgba(255,255,255,.75);margin-top:4px;line-height:1.3}
.mcard .pb{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.mcard .pb svg{width:18px;height:18px;margin-left:2px}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:86%;grid-template-rows:repeat(4,auto);overflow-x:auto;padding:0 20px;column-gap:16px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:0 20px}
.cols .row{scroll-snap-align:start}
.cols .row::after{display:block}
.cols .row:nth-child(4n)::after{display:none}

/* intestazioni album / playlist */
.head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 20px 18px}
.bigcover{width:min(70vw,290px);aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.6);margin-bottom:18px;background:var(--fill)}
.head h2{font-size:22px;font-weight:700;max-width:100%}
.head .by{font-size:20px;color:var(--accent);margin-top:2px;max-width:100%}
.head .info{font-size:13px;color:var(--text2);margin-top:6px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px 20px}
.pill{height:50px;border-radius:25px;background:var(--fill);color:var(--accent);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px}
.pill svg{width:18px;height:18px}
.pill:active{opacity:.6}
.foot{font-size:14px;color:var(--text2);padding:16px 20px 0}
.disc{font-size:15px;font-weight:600;color:var(--text2);padding:18px 0 6px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%}
.mosaic>*{aspect-ratio:1;overflow:hidden}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}

/* artista */
.ahero{position:relative;width:100%;height:min(98vw,470px);overflow:hidden;background:var(--bg2)}
.ahero .img{position:absolute;inset:0}
.ahero .img img{width:100%;height:100%;object-fit:cover;display:block}
.ahero .img .ph.ini span{font-size:30cqw}
.ahero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,transparent 26%,transparent 50%,rgba(0,0,0,.7) 82%,#000)}
.ahero .an{position:absolute;left:20px;right:136px;bottom:20px;z-index:1;font-size:34px;font-weight:800;line-height:1.08;text-shadow:0 2px 14px rgba(0,0,0,.45);overflow-wrap:anywhere}
.ahero .ab{position:absolute;right:18px;bottom:18px;z-index:1;display:flex;gap:10px;align-items:center}
.pbtn{width:54px;height:54px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px rgba(250,45,72,.45)}
.pbtn svg{width:24px;height:24px;margin-left:3px}
.pbtn:active,.sbtn:active{transform:scale(.92)}
.sbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff}
.sbtn svg{width:21px;height:21px}

/* vuoto */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 32px 20px}
.eicon{width:96px;height:96px;border-radius:24px;background:linear-gradient(140deg,#ff5f6d,#fa2d48 55%,#d1173b);display:grid;place-items:center;color:#fff;margin-bottom:22px;box-shadow:0 14px 30px rgba(250,45,72,.35)}
.eicon svg{width:50px;height:50px}
.empty h2{font-size:22px;font-weight:700;margin-bottom:8px}
.empty p{color:var(--text2);font-size:15px;line-height:1.4;max-width:330px;margin-bottom:24px}
.cta{background:var(--accent);color:#fff;border-radius:25px;height:50px;padding:0 26px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.cta svg{width:20px;height:20px}
.cta:active{opacity:.75}
.hint{color:var(--text2);font-size:15px;text-align:center;padding:30px 32px;line-height:1.4}

/* ricerca e generi */
.search{position:relative;margin:0 16px 10px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text2)}
.search input{width:100%;height:40px;border-radius:20px;border:0;background:var(--fill);color:var(--text);font:inherit;font-size:17px;padding:0 14px 0 36px;outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--text2)}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px}
.gtile{position:relative;aspect-ratio:1.55;border-radius:14px;overflow:hidden;background:linear-gradient(140deg,hsl(var(--h) 58% 46%),hsl(calc(var(--h) + 30) 52% 26%));cursor:pointer;text-align:left}
.gtile b{position:absolute;left:12px;top:10px;right:10px;font-size:17px;font-weight:700;z-index:1}
.gtile .gc{position:absolute;right:-9%;bottom:-14%;width:52%;aspect-ratio:1;transform:rotate(20deg);border-radius:7px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.gtile .gc img{width:100%;height:100%;object-fit:cover}

/* indice alfabetico */
.abc{position:fixed;right:1px;top:calc(var(--top) + 10px);bottom:calc(env(safe-area-inset-bottom) + 160px);z-index:15;display:flex;flex-direction:column;justify-content:center;align-items:center;touch-action:none;padding:0 3px}
.abc span{font-size:11px;font-weight:600;color:var(--accent);line-height:1;flex:0 1 15px;display:flex;align-items:center;width:15px;justify-content:center;min-height:8px}

/* impostazioni */
.ghead{font-size:13px;color:var(--text2);text-transform:uppercase;padding:20px 36px 7px;letter-spacing:.02em}
.group{margin:0 16px;background:var(--bg2);border-radius:14px;overflow:hidden}
.gitem{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 16px;position:relative;width:100%;text-align:left}
.gitem+.gitem::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.gitem .gv{color:var(--text2);text-align:right}
.gitem.red{color:#ff453a;justify-content:center}
.gitem.acc{color:var(--accent)}
.gitem[hidden]{display:none}
.gdel{color:#ff453a;width:32px;height:32px;display:grid;place-items:center;flex:none}
.gdel svg{width:22px;height:22px}
.gfoot{font-size:13px;color:var(--text2);padding:8px 36px 4px;line-height:1.4}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;transition:background .25s;flex:none;cursor:pointer}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.sw:checked{background:#30d158}
.sw:checked::before{transform:translateX(20px)}

/* dock: mini player + tab bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 14px calc(8px + env(safe-area-inset-bottom));pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.dock::before{content:"";position:absolute;left:0;right:0;top:-30px;bottom:0;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.92) 55%);z-index:-1}
.mini{pointer-events:auto;width:100%;max-width:560px;height:58px;border-radius:29px;display:flex;align-items:center;gap:11px;padding:0 8px 0 9px;position:relative;overflow:hidden;cursor:pointer}
.mini[hidden]{display:none}
.mini .thumb{width:42px;height:42px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mini .mt{flex:1;min-width:0}
.mini .t1{font-size:15px;font-weight:600}
.mini .t2{font-size:13px}
.mini .mb{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;flex:none}
.mini .mb svg{width:25px;height:25px}
.mini .mb:active{background:var(--fill)}
.mbar{position:absolute;left:24px;right:24px;bottom:0;height:2px;border-radius:1px;background:rgba(255,255,255,.08)}
.mbar i{display:block;height:100%;width:0;background:rgba(255,255,255,.55);border-radius:1px}
.tabrow{pointer-events:auto;display:flex;gap:10px;align-items:center;width:100%;max-width:560px}
.tabbar{flex:1;display:flex;padding:4px;border-radius:33px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border-radius:28px;font-size:10px;font-weight:600;color:var(--text);transition:background .2s,color .2s}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--accent);background:rgba(255,255,255,.1)}
.sbig{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text)}
.sbig svg{width:26px;height:26px}
.sbig.on{color:var(--accent)}

/* in riproduzione */
.np{position:fixed;inset:0;z-index:50;transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);color:#fff;overflow:hidden;background:#1a1a1c;visibility:hidden}
.np.open{transform:none;visibility:visible}
.np.vis{visibility:visible}
.np-bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--npc,#555),color-mix(in srgb,var(--npc,#555) 40%,#000));transition:background .6s}
.np-blur{position:absolute;inset:-25%;width:150%;height:150%;object-fit:cover;filter:blur(70px) saturate(1.6);opacity:.55;transform:translateZ(0)}
.np-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.42))}
.np-in{position:relative;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 4px) 28px calc(env(safe-area-inset-bottom) + 14px);max-width:520px;margin:0 auto}
.grab{align-self:center;width:72px;height:26px;display:grid;place-items:center;flex:none}
.grab span{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.45)}
.np-head{display:none;align-items:center;gap:12px;margin:8px 0 6px;flex:none}
.np-head .thumb{width:60px;height:60px;border-radius:9px;background:rgba(255,255,255,.1);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.np-head .hm{flex:1;min-width:0}
.np-head .t1{font-size:17px;font-weight:600}
.np-head .t2{font-size:15px;color:rgba(255,255,255,.62)}
.np-artw{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:14px 0}
.np-art{width:100%;max-width:46vh;aspect-ratio:1;border-radius:14px;overflow:hidden;box-shadow:0 24px 54px rgba(0,0,0,.45);transition:transform .55s cubic-bezier(.34,1.35,.64,1),box-shadow .55s;background:rgba(255,255,255,.1)}
.np-art img{width:100%;height:100%;object-fit:cover;display:block}
.np.paused .np-art{transform:scale(.8);box-shadow:0 10px 26px rgba(0,0,0,.3)}
.np-lyr,.np-q{flex:1;min-height:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.np-lyr{margin:0 -28px;padding:18px 28px 45vh;-webkit-mask-image:linear-gradient(transparent,#000 7%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 7%,#000 78%,transparent)}
.np[data-mode="lyrics"] .np-lyr,.np[data-mode="queue"] .np-q{display:block}
.np[data-mode="lyrics"] .np-head,.np[data-mode="queue"] .np-head{display:flex}
.np[data-mode="lyrics"] .np-artw,.np[data-mode="queue"] .np-artw,.np[data-mode="lyrics"] .np-meta,.np[data-mode="queue"] .np-meta{display:none}
.lyr p{font-size:28px;font-weight:700;line-height:1.24;margin:0 0 20px;color:rgba(255,255,255,.88);letter-spacing:-.005em}
.lyr p.gap{height:8px;margin:0}
.lyr.sync p{color:rgba(255,255,255,.3);transition:color .35s,transform .35s;transform-origin:left center;cursor:pointer}
.lyr.sync p.on{color:#fff;transform:scale(1.03)}
.nolyr{text-align:center;padding:60px 10px;color:rgba(255,255,255,.7);font-size:17px}
.np-pill{margin-top:18px;height:44px;padding:0 20px;border-radius:22px;background:rgba(255,255,255,.18);font-weight:600;color:#fff}
.np-q{margin:0 -10px;padding:4px 10px 20px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 6px}
.qhead b{font-size:17px;display:block}
.qhead span{font-size:13px;color:rgba(255,255,255,.6)}
.qb{display:flex;gap:8px;flex:none}
.qbtn{width:46px;height:34px;border-radius:17px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:rgba(255,255,255,.85);position:relative}
.qbtn svg{width:19px;height:19px}
.qbtn.on{background:rgba(255,255,255,.92);color:#000}
.qbtn .one{position:absolute;right:7px;top:3px;font-size:9px;font-weight:800}
.np-q .row{min-height:56px;--sl:58px}
.np-q .row::after{background:rgba(255,255,255,.14)}
.np-q .t2{color:rgba(255,255,255,.6)}
.np-q .thumb{width:44px;height:44px;background:rgba(255,255,255,.1)}
.np-q .more{color:rgba(255,255,255,.6)}
.np-q .empty-q{color:rgba(255,255,255,.6);font-size:15px;padding:10px 0}
.np-meta{display:flex;align-items:center;gap:10px;margin-top:6px;flex:none}
.np-meta .mm{flex:1;min-width:0}
.np-title{font-size:21px;font-weight:600}
.np-artist{font-size:19px;color:rgba(255,255,255,.62);margin-top:1px}
.np-ib{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;color:#fff}
.np-ib svg{width:18px;height:18px}
.np-ib.on{background:rgba(255,255,255,.92);color:var(--accent)}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin-top:14px;cursor:pointer;--p:0%;flex:none}
.seek::-webkit-slider-runnable-track{height:7px;border-radius:4px;background:linear-gradient(to right,rgba(255,255,255,.88) var(--p),rgba(255,255,255,.25) var(--p))}
.seek::-moz-range-track{height:7px;border-radius:4px;background:linear-gradient(to right,rgba(255,255,255,.88) var(--p),rgba(255,255,255,.25) var(--p))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:7px;border-radius:50%;background:transparent;border:0}
.seek::-moz-range-thumb{width:7px;height:7px;border:0;background:transparent}
.seek:active::-webkit-slider-runnable-track{height:11px;margin-top:-2px}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;margin-top:2px;flex:none}
.np-ctrl{display:flex;justify-content:space-evenly;align-items:center;margin:16px 0 22px;flex:none}
.cb{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .15s}
.cb:active{background:rgba(255,255,255,.14);transform:scale(.9)}
.cb svg{width:40px;height:40px}
.cb.big svg{width:54px;height:54px}
.np-bot{display:flex;justify-content:space-between;align-items:center;padding:0 22px;flex:none}
.bb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.65);transition:background .2s,color .2s}
.bb svg{width:23px;height:23px}
.bb.on{background:rgba(255,255,255,.92);color:#000}

/* action sheet */
.sheetw{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheetw[hidden]{display:none}
.shbg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.sheet{position:relative;width:100%;max-width:500px;padding:0 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.32,.72,0,1);max-height:88vh;display:flex;flex-direction:column}
.sheetw.show .shbg{opacity:1}
.sheetw.show .sheet{transform:none}
.shg{border-radius:22px;overflow:hidden auto;background:rgba(44,44,48,.82);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.16)}
.shh{display:flex;align-items:center;gap:12px;padding:14px 18px;text-align:left;border-bottom:.5px solid var(--sep)}
.shh .thumb{width:46px;height:46px}
.shh .t1{font-weight:600}
.shb{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:0 20px;font-size:17px;color:var(--text);text-align:left}
.shb+.shb{border-top:.5px solid var(--sep)}
.shb svg{width:22px;height:22px;color:var(--text);flex:none}
.shb.red,.shb.red svg{color:#ff453a}
.shb:active{background:var(--fill)}
.shc{margin-top:8px;width:100%;height:56px;border-radius:22px;background:rgba(44,44,48,.92);font-weight:600;font-size:17px;color:var(--text);flex:none}

/* modulo modifica */
.modal{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;justify-content:flex-end}
.modal .mbg{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.modal .mbox{position:relative;height:calc(100% - env(safe-area-inset-top) - 10px);background:#1c1c1e;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden}
.modal.show .mbg{opacity:1}
.modal.show .mbox{transform:none}
.mnav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;padding:0 6px;flex:none}
.mnav b{font-size:17px}
.mnav button{color:var(--accent);font-size:17px;padding:8px 12px;justify-self:start}
.mnav .done{font-weight:600;justify-self:end}
.mbody{flex:1;overflow-y:auto;padding:4px 0 60px}
.mcov{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 10px}
.mcov .cover{width:150px}
.mcov button{color:var(--accent);font-size:16px}
.form{margin:14px 16px 0;background:#2c2c2e;border-radius:14px;overflow:hidden}
.fr{display:flex;align-items:center;min-height:48px;padding:0 16px;position:relative;gap:12px}
.fr+.fr::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.fr label{width:108px;flex:none;font-size:16px}
.fr input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:16px;outline:none;padding:12px 0}
.fr input::placeholder,.fr textarea::placeholder{color:var(--text3)}
.fr.area{display:block;padding:12px 16px}
.fr.area label{display:block;width:auto;margin-bottom:6px;color:var(--text2);font-size:13px;text-transform:uppercase}
.fr textarea{width:100%;min-height:220px;border:0;background:none;color:var(--text);font:inherit;font-size:15px;line-height:1.4;outline:none;resize:vertical}
.mfoot{font-size:13px;color:var(--text2);padding:8px 32px 0;line-height:1.4}

/* toast e progresso */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translate(-50%,10px);opacity:0;z-index:99;padding:11px 18px;border-radius:22px;font-size:15px;font-weight:600;transition:opacity .3s,transform .3s;white-space:nowrap;pointer-events:none;color:var(--text);max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.prog{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);z-index:99;width:min(86vw,320px);padding:12px 16px;border-radius:18px;font-size:14px;font-weight:600}
.prog .pb{height:4px;border-radius:2px;background:var(--fill);margin-top:8px;overflow:hidden}
.prog .pb i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
input[type=file]{display:none}

/* resoconto */
.seg{display:flex;margin:0 16px 16px;padding:2px;border-radius:10px;background:var(--fill)}
.seg button{flex:1;height:30px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text);transition:background .2s}
.seg button.on{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.card{margin:0 16px 14px;background:var(--bg2);border-radius:18px;padding:16px}
.clabel{font-size:13px;font-weight:600;color:var(--text2)}
.hero{font-size:52px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
.hero small{font-size:22px;font-weight:600;color:var(--text2);margin:0 4px 0 3px;letter-spacing:0}
.delta{font-size:14px;color:var(--text2);margin-top:6px}
.caption{font-size:14px;color:var(--text2);margin-top:16px;min-height:19px}
.caption b{color:var(--text);font-weight:600}
.chart{position:relative;height:140px;margin-top:22px;padding-right:46px;display:flex;align-items:flex-end;gap:2px}
.chart::after{content:"";position:absolute;left:0;right:46px;bottom:0;height:1px;background:var(--sep)}
.gl,.avg{position:absolute;left:0;right:46px;height:0;pointer-events:none}
.gl{border-top:1px solid var(--sep)}
.avg{border-top:1.5px solid var(--text3)}
.gl span,.avg span{position:absolute;left:calc(100% + 6px);transform:translateY(-55%);font-size:11px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;position:relative;z-index:1}
.bar{width:100%;max-width:24px;background:var(--accent);border-radius:4px 4px 0 0;transition:opacity .2s,height .35s}
.chart.sel .col:not(.on) .bar{opacity:.3}
.xl{display:flex;gap:2px;padding-right:46px;margin-top:6px;height:14px}
.xl span{flex:1;min-width:0;display:flex;justify-content:center;font-size:11px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 16px 4px}
.tile2{background:var(--bg2);border-radius:16px;padding:12px 12px 11px}
.tile2 b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.tile2 span{font-size:12px;color:var(--text2)}
.mtitle{font-size:20px;font-weight:700;margin:2px 0 6px}
.mom{display:grid;grid-template-columns:92px minmax(0,1fr) 40px;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.trk{height:8px;border-radius:4px;background:var(--fill)}
.trk i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.mom .pc{text-align:right;color:var(--text2);font-variant-numeric:tabular-nums;font-size:14px}

/* 3.0: mini player con avanti/indietro e scorrimento, avviso "metti in ordine", conteggi */
.mini .mb{width:38px}
.mini .mt{transition:transform .22s ease-out,opacity .22s}
.mini.drag .mt{transition:none}
.navrow .nc{color:var(--text2);font-size:17px;font-variant-numeric:tabular-nums}
.banner{margin:6px 16px 10px;padding:15px 16px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(250,45,72,.28),rgba(250,45,72,.08));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.banner b{display:block;font-size:17px;margin-bottom:3px}
.banner span{display:block;font-size:14px;color:var(--text2);line-height:1.35}
.banner .bb2{display:flex;align-items:center;gap:16px;margin-top:12px}
.banner .cta{height:38px;padding:0 18px;font-size:15px}
.banner .lk{color:var(--text2);font-size:15px}
.gitem .gs{display:block;font-size:13px;color:var(--text2);margin-top:2px}
.gitem.col{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:9px 16px}
</style>
</head>
<body>
<header class="topbar" id="top"></header>
<main id="view"></main>

<div class="dock">
  <div class="mini glass" id="mini" data-act="openNP" hidden>
    <div class="thumb" id="miniArt"></div>
    <div class="mt"><div class="t1 ell" id="miniT"></div><div class="t2 ell" id="miniA"></div></div>
    <button class="mb" data-act="prev" id="miniPrev" aria-label="Brano precedente"></button>
    <button class="mb" data-act="toggle" id="miniPlay" aria-label="Riproduci o metti in pausa"></button>
    <button class="mb" data-act="next" id="miniNext" aria-label="Brano successivo"></button>
    <div class="mbar"><i id="miniBar"></i></div>
  </div>
  <div class="tabrow">
    <nav class="tabbar glass">
      <button data-act="tab" data-tab="home"></button>
      <button data-act="tab" data-tab="lib"></button>
      <button data-act="tab" data-tab="stats"></button>
    </nav>
    <button class="sbig glass" data-act="tab" data-tab="cerca" id="tabSearch" aria-label="Cerca"></button>
  </div>
</div>

<section class="np" id="np" data-mode="art" aria-label="In riproduzione">
  <div class="np-bg"></div><img class="np-blur" id="npBlur" alt=""><div class="np-shade"></div>
  <div class="np-in" id="npIn">
    <button class="grab" data-act="closeNP" aria-label="Chiudi"><span></span></button>
    <div class="np-head"><div class="thumb" id="npHArt"></div><div class="hm"><div class="t1 ell" id="npHT"></div><div class="t2 ell" id="npHA"></div></div><button class="np-ib js-fav" data-act="favCur" aria-label="Preferito"></button><button class="np-ib js-more" data-act="npMenu" aria-label="Altre opzioni"></button></div>
    <div class="np-artw"><div class="np-art" id="npArt"></div></div>
    <div class="np-lyr" id="npLyr"></div>
    <div class="np-q" id="npQ"></div>
    <div class="np-meta"><div class="mm"><div class="np-title ell" id="npT"></div><div class="np-artist ell" id="npA"></div></div><button class="np-ib js-fav" data-act="favCur" aria-label="Preferito"></button><button class="np-ib js-more" data-act="npMenu" aria-label="Altre opzioni"></button></div>
    <input type="range" class="seek" id="seek" min="0" max="1000" value="0" aria-label="Posizione">
    <div class="times"><span id="tCur">0:00</span><span id="tRem">-0:00</span></div>
    <div class="np-ctrl">
      <button class="cb" data-act="prev" id="npPrev" aria-label="Precedente"></button>
      <button class="cb big" data-act="toggle" id="npPlay" aria-label="Riproduci o metti in pausa"></button>
      <button class="cb" data-act="next" id="npNext" aria-label="Successivo"></button>
    </div>
    <div class="np-bot">
      <button class="bb" data-act="mode" data-m="lyrics" id="bLyr" aria-label="Testo"></button>
      <button class="bb" data-act="airplay" id="bAir" aria-label="AirPlay" style="visibility:hidden"></button>
      <button class="bb" data-act="mode" data-m="queue" id="bQueue" aria-label="A seguire"></button>
    </div>
  </div>
</section>

<div class="sheetw" id="sheet" hidden><div class="shbg" data-sh="-1"></div><div class="sheet" id="sheetIn"></div></div>
<input type="file" id="fileIn" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus">
<input type="file" id="imgIn" accept="image/*">
<audio id="au" preload="auto" playsinline x-webkit-airplay="allow"></audio>

<script>

/* ============ Icone ============ */

  mic: S('<path d="m13.8 4.2 6 6M14.5 3.5a4.4 4.4 0 0 1 6 6l-1 1-6-6zM13.5 5.5 4.3 16.9a1.5 1.5 0 0 0 .1 2l.7.7a1.5 1.5 0 0 0 2 .1L18.5 10.5"/>', st),
  album: S('<rect x="3.5" y="7.5" width="13" height="13" rx="2.5"/><path d="M7 4h10.5A3 3 0 0 1 20.5 7v10.5"/>', st),
  genre: S('<path d="M3.5 11 11 3.5h7.5a2 2 0 0 1 2 2V13L13 20.5z"/><circle cx="16.3" cy="7.7" r="1.4" fill="currentColor" stroke="none"/>', st),
  home: S('<path fill="currentColor" d="M3 10.6 11.2 3.8a1.3 1.3 0 0 1 1.6 0L21 10.6V20a1.5 1.5 0 0 1-1.5 1.5h-4.2v-6.3H8.7v6.3H4.5A1.5 1.5 0 0 1 3 20z"/>'),
  lib: S('<rect x="3" y="7" width="14" height="14.5" rx="3.2" fill="currentColor"/><path d="M7.2 3.8h9.4A3.6 3.6 0 0 1 20.2 7.4V16.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12.4 10.2v5.7" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><circle cx="10.9" cy="16.2" r="1.9" fill="#000"/>'),

      for (const t of resti) {
        const r = migliore(t, await itunes(`${nome} ${baseTit(t.title)}`, 25));
        if (r) { await applica(t, r, ALC); trovati++; } else { t.cat = -1; await DB.put('tracks', t); }
        passo();
      }
    }
  } catch (e) { errore = e; console.error(e); }
  CAT.run = false; if (pr) pr.done();
  saveStats(true); await pulisciArte(); libChanged(); ui(true); aggiornaMS();
  if (errore) toast(errore.limite ? 'Apple ha messo in pausa le ricerche: riprova tra qualche minuto' : 'Connessione interrotta: riprova più tardi, riparto da dove mi sono fermato');
  else if (!silent || trovati) toast(`${plur(trovati, 'brano completato', 'brani completati')}${todo.length - trovati ? ` · ${todo.length - trovati} non trovati` : ''}`);
}
/* Per un singolo brano: scegli tu l'album giusto tra i risultati */
async function scegliAlbum(id) {
  const t = byId.get(id); if (!t) return;
  if (navigator.onLine === false) { toast('Serve una connessione a internet'); return; }
  const ix = IX(), nome = ix.canon.get((ix.cred.get(id) || [])[0]) || t.artist;
  toast('Cerco su Apple Music…');
  let res; try { res = await itunes(`${nome} ${baseTit(t.title)}`, 50); } catch (e) { toast('Ricerca non riuscita'); return; }
  const bt = baseTit(t.title), ks = ix.cred.get(id) || [akey(t.artist)], visti = new Set();
  const c = res.filter(r => { const b = baseTit(r.trackName); return r.kind === 'song' && b && (b === bt || b.includes(bt) || bt.includes(b)); })
    .map(r => ({ r, s: punteggio(t, r, ks) })).sort((a, b) => b.s - a.s || String(a.r.releaseDate).localeCompare(String(b.r.releaseDate)))
    .filter(x => !visti.has(x.r.collectionId) && visti.add(x.r.collectionId)).slice(0, 8);
  const items = c.map(({ r }) => ({ l: `${String(r.collectionName).replace(/\s+-\s+(single|ep)$/i, m => m.toLowerCase().includes('ep') ? ' (EP)' : ' (singolo)')} · ${r.artistName} · ${String(r.releaseDate || '').slice(0, 4)}`, i: 'albumGo',
    f: async () => { await applica(t, r, cacheAlbum()); saveStats(true); await pulisciArte(); libChanged(); ui(true); aggiornaMS(); toast('Album aggiornato'); } }));
  if (t.prev) items.push({ l: 'Ripristina le informazioni originali', i: 'x', red: true, f: () => ripristina([t]) });
  if (!items.length) { toast('Nessun risultato su Apple Music'); return; }
  await scegli(`${headT(t)}`, items);
}
async function ripristina(list) {
  for (const t of list) {
    if (!t.prev) continue;
    Object.assign(t, t.prev); delete t.prev; delete t.albumId; delete t.albumType; t.cat = 'no';
    await DB.put('tracks', t);
    const m = STATS.m[t.id]; if (m) { Object.assign(m, { aa: t.albumArtist || t.artist, al: t.album, k: t.artKey, ai: null }); statsDirty = true; }
  }
  saveStats(true); await pulisciArte(); libChanged(); ui(true); aggiornaMS(); toast('Informazioni originali ripristinate');
}

const AZ = {

  goArtists: () => push('artisti'),
  goAlbums: () => { SORT.albums = 'added'; LS.set('sort', SORT); push('albums'); },
  settings: () => push('imp'),
  aggiungi: () => $('#fileIn').click(),
  play: b => { const ids = CTX[b.dataset.ctx]; if (ids) avvia(ids, +b.dataset.i, undefined, CTXL[b.dataset.ctx]); },
  playOne: b => avvia([b.dataset.id], 0, false),
  playAll: b => { const ids = CTX[b.dataset.ctx]; if (ids) avvia(ids, 0, false, CTXL[b.dataset.ctx]); },
  shufAll: b => { const ids = CTX[b.dataset.ctx]; if (ids) avvia(ids, -1, true, CTXL[b.dataset.ctx]); },
  songMenu: b => menuBrano(b.dataset.id, b.dataset.ctx),
  npMenu: () => { if (P.cur) menuBrano(P.cur, null, true); },
  favCur: () => { if (P.cur) toggleFav('t', P.cur); },
  favAlbum: () => toggleFav('al', pagina().key),
  favArtist: () => toggleFav('a', pagina().k),
  favPL: () => toggleFav('p', pagina().id),
  albumMenu: () => menuAlbum(),
  artistMenu: () => menuArtista(),
  plMenu: () => menuPlaylist(),
  sortBrani: async () => { const o = [['title', 'Titolo'], ['artist', 'Artista'], ['added', 'Aggiunti di recente']]; const i = await foglio('<div class="t1">Ordina per</div>', o.map(([k, l]) => ({ l, i: SORT.brani === k ? 'check' : '' }))); if (i >= 0) { SORT.brani = o[i][0]; LS.set('sort', SORT); render(); } },
  sortAlbums: async () => { const o = [['title', 'Titolo'], ['artist', 'Artista'], ['year', 'Anno'], ['added', 'Aggiunti di recente']]; const i = await foglio('<div class="t1">Ordina per</div>', o.map(([k, l]) => ({ l, i: SORT.albums === k ? 'check' : '' }))); if (i >= 0) { SORT.albums = o[i][0]; LS.set('sort', SORT); render(); } },
  toggle: () => toggle(),
  next: () => succ(),
  prev: () => prec(),
  shuffle: () => toggleShuffle(),
  repeat: () => toggleRepeat(),
  mode: b => setMode(b.dataset.m),
  airplay: () => { try { au.webkitShowPlaybackTargetPicker(); } catch (e) {} },
  jump: b => carica(+b.dataset.i, true),
  qDel: b => { const i = +b.dataset.i; if (i <= P.idx || i >= P.queue.length) return; const id = P.queue.splice(i, 1)[0]; const o = P.orig.lastIndexOf(id); if (o >= 0) P.orig.splice(o, 1); precarica(); salvaStato(); disegnaCoda(); },
  lyrSeek: b => { const l = LYR.lines[+b.dataset.i]; if (l) { LYR.user = 0; vai(l.t); if (!P.playing) suona(); } },
  editLyrics: () => { if (P.cur) modificaBrano(P.cur, 'lyrics'); },
  openNP: () => apriNP(),
  closeNP: () => chiudiNP(),
  newPL: () => nuovaPlaylist(),
  nsAdd: () => { const n = prompt('Nome dell’artista o del gruppo da non separare', ''); if (n) aggiungiNoSplit(n); },
  nsDel: b => { NOSPLIT.splice(+b.dataset.i, 1); LS.set('nosplit', NOSPLIT); nsRe = null; libChanged(); },
  statK: b => { SU.k = b.dataset.k; SU.sel = null; render(true); },
  bar: b => { const i = +b.dataset.i; SU.sel = SU.sel === i ? null : i; render(true); },
  resetStats: () => { if (confirm('Azzerare tutte le statistiche di ascolto?')) { STATS = { d: {}, m: {}, r: [], lp: {} }; LS.set('stats', STATS); toast('Resoconto azzerato'); render(true); } },
  wipe: () => eliminaTutto(),
  catalogo: () => catalogo(),
  catNo: () => { SET.catNo = true; saveSET(); render(true); toast('Puoi farlo quando vuoi da Impostazioni'); },
  ripristina: () => { const l = TR.filter(t => t.prev); if (l.length && confirm(`Togliere album, anni e copertine aggiunti da Apple Music a ${plur(l.length, 'brano', 'brani')}?`)) ripristina(l).then(() => render(true)); },
  cassetta: () => cassetta(true)
};
/* Vibrazione leggera sui comandi principali (solo nell'app) */
const TAPTIC = new Set(['toggle', 'next', 'prev', 'favCur', 'favAlbum', 'favArtist', 'favPL', 'shuffle', 'repeat', 'play', 'playOne', 'playAll', 'shufAll', 'tab', 'songMenu', 'npMenu', 'jump']);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.closest('.modal')) return;
  const f = AZ[b.dataset.act]; if (!f) return;
  if (TAPTIC.has(b.dataset.act)) vibra();
  e.stopPropagation(); f(b, e);
});
document.addEventListener('input', e => { if (e.target.id === 'q') { risultati(); markOn(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'swFake') { SET.fakePause = e.target.checked; saveSET(); if (!SET.fakePause && P.fake) fermaFinta(); }
  if (e.target.id === 'fileIn') { const f = [...e.target.files]; e.target.value = ''; if (f.length) importa(f); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight' && e.altKey) succ();
  if (e.code === 'ArrowLeft' && e.altKey) prec();
});

  const migAl = k => { const m = /^al:(.*?)\|(.*)$/.exec(k); return m ? 'al:' + akey(m[1]) + '|' + m[2] : k; };
  FAV.a = [...new Set(FAV.a.map(akey))];

}

(async () => {
  try {
    await DB.open();
    const [tracks, keys, arts] = await Promise.all([DB.all('tracks'), DB.keys('art'), DB.all('art')]);
    keys.forEach((k, i) => { const a = arts[i]; if (a && a.blob) ART.set(k, { url: URL.createObjectURL(a.blob), blob: a.blob, color: a.color }); });
    TR = tracks; TR.forEach(t => byId.set(t.id, t));
    PL.forEach(p => p.ids = p.ids.filter(id => byId.has(id)));
    FAV.t = FAV.t.filter(id => byId.has(id));
    const s = LS.get('player', null);
    if (s && Array.isArray(s.queue)) {
      P.queue = s.queue.filter(id => byId.has(id)); P.orig = (s.orig || s.queue).filter(id => byId.has(id));
      P.shuffle = !!s.shuffle; P.repeat = s.repeat || 'off'; P.from = s.from || '';
      const id = s.queue[s.idx]; const i = P.queue.indexOf(id);
      if (i >= 0) await carica(i, false, s.time || 0);
    }
  } catch (e) { console.error(e); toast('Impossibile aprire la libreria'); }
  render(); ui(true);
  setTimeout(async () => {
    await rescan().catch(e => console.error(e));
    await cassetta(false);
  }, 1200);
})();
