<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Musica">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Musica</title>
<style>
:root{--accent:#fa2d48;--bg:#fff;--bg2:#f2f2f7;--text:#000;--text2:rgba(60,60,67,.6);--text3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);--fill2:rgba(120,120,128,.16);--glass:rgba(250,250,252,.78);--glass-b:rgba(0,0,0,.06);--shadow:0 10px 30px rgba(0,0,0,.12);--sw-off:#e9e9eb;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--bg2:#1c1c1e;--text:#fff;--text2:rgba(235,235,245,.6);--text3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--fill2:rgba(120,120,128,.32);--glass:rgba(30,30,32,.78);--glass-b:rgba(255,255,255,.08);--shadow:0 10px 30px rgba(0,0,0,.55);--sw-off:#39393d;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
svg{display:block}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* barra superiore */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:.5px solid transparent;transition:background .25s,border-color .25s}
.topbar.scrolled{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.topbar .tt{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;max-width:56vw}
.topbar.scrolled .tt{opacity:1}
.back{color:var(--accent);display:flex;align-items:center;gap:1px;justify-self:start;max-width:38vw;height:44px;padding-right:6px}
.back svg{width:24px;height:24px;flex:none}
.tbtn{justify-self:end;color:var(--accent);width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.tbtn svg{width:24px;height:24px}
main{padding:calc(44px + env(safe-area-inset-top)) 0 calc(180px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.large{font-size:34px;font-weight:700;letter-spacing:.01em;padding:2px 20px 12px;line-height:1.2}

/* liste */
.navlist{padding-left:20px;margin-bottom:6px}
.navrow{display:flex;align-items:center;gap:14px;width:100%;height:50px;position:relative;text-align:left}
.navrow::after{content:"";position:absolute;left:40px;right:0;bottom:0;height:.5px;background:var(--sep)}
.navrow:last-child::after{display:none}
.navrow .ni{color:var(--accent);width:26px;display:grid;place-items:center}
.navrow .ni svg{width:24px;height:24px}
.navrow .nl{flex:1;font-size:20px}
.navrow .nc{color:var(--text2);font-size:15px}
.chev{color:var(--text3);padding-right:16px}
.chev svg{width:18px;height:18px}
.list{padding-left:20px}
.row{display:flex;align-items:center;gap:12px;min-height:60px;position:relative;cursor:pointer;padding-right:4px}
.row::after{content:"";position:absolute;left:var(--sl,60px);right:0;bottom:0;height:.5px;background:var(--sep)}
.row:last-child::after{display:none}
.row:active,.navrow:active,.tile:active .cover,.gitem.tap:active{opacity:.6}
.row .rt{flex:1;min-width:0;padding:8px 0}
.t1{font-size:16px}
.t2{font-size:14px;color:var(--text2);margin-top:1px}
.row.on .t1{color:var(--accent)}
.row.num{min-height:48px;--sl:36px}
.num-i{width:24px;text-align:center;color:var(--text2);font-size:15px;flex:none;display:grid;place-items:center}
.row.num .t2{display:none}
.row.num.feat .t2{display:block}
.dur{color:var(--text2);font-size:14px;font-variant-numeric:tabular-nums}
.thumb{width:48px;height:48px;border-radius:6px;overflow:hidden;flex:none;position:relative;background:var(--fill)}
.thumb img,.cover img,.av img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .eqw{position:absolute;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;color:#fff}
.more{width:40px;height:40px;display:grid;place-items:center;color:var(--text2);flex:none;border-radius:50%}
.more svg{width:20px;height:20px}
.av{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none;background:var(--fill)}
.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(140deg,hsl(var(--h) 62% 66%),hsl(calc(var(--h) + 35) 52% 42%));color:rgba(255,255,255,.9)}
.ph svg{width:42%;height:42%}
.sec{font-size:22px;font-weight:700;padding:26px 20px 12px;letter-spacing:.01em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px;padding:0 20px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{text-align:left;cursor:pointer;min-width:0}
.cover{aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--fill);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tile .a1{font-size:14px;margin-top:7px}
.tile .a2{font-size:14px;color:var(--text2)}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:0 20px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .tile{flex:0 0 42%;max-width:180px;scroll-snap-align:start}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px;width:14px}
.eq i{flex:1;background:currentColor;border-radius:1px;height:40%}
.eq i:nth-child(2){height:100%}.eq i:nth-child(3){height:65%}
.eq.go i{animation:eq .9s ease-in-out infinite alternate}
.eq.go i:nth-child(2){animation-delay:-.3s}.eq.go i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%{height:20%}100%{height:100%}}
.row.on .num-i{color:var(--accent)}

/* intestazioni album / artista / playlist */
.head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 20px 18px}
.bigcover{width:min(66vw,270px);aspect-ratio:1;border-radius:11px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.24);margin-bottom:16px;background:var(--fill)}
.bigav{width:min(44vw,170px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.2);margin-bottom:14px;background:var(--fill)}
.head h2{font-size:22px;font-weight:700;max-width:100%}
.head .by{font-size:20px;color:var(--accent);margin-top:2px;max-width:100%}
.head .info{font-size:13px;color:var(--text2);margin-top:5px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px 18px}
.pill{height:50px;border-radius:12px;background:var(--fill);color:var(--accent);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px}
.pill svg{width:18px;height:18px}
.pill:active{opacity:.6}
.foot{font-size:14px;color:var(--text2);padding:14px 20px 0}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%}
.mosaic>*{aspect-ratio:1;overflow:hidden}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}

/* vuoto */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 32px 20px}
.eicon{width:96px;height:96px;border-radius:24px;background:linear-gradient(140deg,#ff5f6d,#fa2d48 55%,#d1173b);display:grid;place-items:center;color:#fff;margin-bottom:22px;box-shadow:0 14px 30px rgba(250,45,72,.35)}
.eicon svg{width:50px;height:50px}
.empty h2{font-size:22px;font-weight:700;margin-bottom:8px}
.empty p{color:var(--text2);font-size:15px;line-height:1.4;max-width:330px;margin-bottom:24px}
.cta{background:var(--accent);color:#fff;border-radius:14px;height:50px;padding:0 24px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.cta svg{width:20px;height:20px}
.cta:active{opacity:.75}
.hint{color:var(--text2);font-size:15px;text-align:center;padding:30px 32px}

/* ricerca */
.search{position:relative;margin:0 16px 10px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text2)}
.search input{width:100%;height:38px;border-radius:11px;border:0;background:var(--fill);color:var(--text);font:inherit;font-size:17px;padding:0 12px 0 34px;outline:none;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--text2)}

/* impostazioni */
.ghead{font-size:13px;color:var(--text2);text-transform:uppercase;padding:18px 36px 7px;letter-spacing:.02em}
.group{margin:0 16px;background:var(--bg2);border-radius:12px;overflow:hidden}
.gitem{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 16px;position:relative;width:100%;text-align:left}
.gitem+.gitem::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.gitem .gv{color:var(--text2)}
.gitem.red{color:#ff3b30;justify-content:center}
.gitem[hidden]{display:none}
.gitem.acc{color:var(--accent)}
.gfoot{font-size:13px;color:var(--text2);padding:8px 36px 4px;line-height:1.4}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--sw-off);position:relative;transition:background .25s;flex:none;cursor:pointer}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.sw:checked{background:#34c759}
.sw:checked::before{transform:translateX(20px)}

/* dock: mini player + tab bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(8px + env(safe-area-inset-bottom));pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.dock::before{content:"";position:absolute;left:0;right:0;top:-24px;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 45%);z-index:-1;opacity:.9}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:.5px solid var(--glass-b);box-shadow:var(--shadow)}
.mini{pointer-events:auto;width:100%;max-width:560px;height:60px;border-radius:20px;display:flex;align-items:center;gap:11px;padding:0 6px 0 10px;position:relative;overflow:hidden;cursor:pointer}
.mini[hidden]{display:none}
.mini .thumb{width:42px;height:42px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.mini .mt{flex:1;min-width:0}
.mini .t1{font-size:15px;font-weight:500}
.mini .t2{font-size:13px}
.mini .mb{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.mini .mb svg{width:26px;height:26px}
.mini .mb:active{background:var(--fill)}
.mbar{position:absolute;left:18px;right:18px;bottom:0;height:2px;border-radius:1px;background:var(--fill)}
.mbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:1px}
.tabbar{pointer-events:auto;display:flex;gap:2px;padding:5px;border-radius:34px}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:80px;height:54px;border-radius:28px;font-size:10px;font-weight:600;color:var(--text);transition:background .2s,color .2s}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--accent);background:var(--fill)}

/* in riproduzione */
.np{position:fixed;inset:0;z-index:50;transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);color:#fff;overflow:hidden;background:#232326;visibility:hidden}
.np.open{transform:none;visibility:visible}
.np.vis{visibility:visible}
.np-bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--npc,#555),color-mix(in srgb,var(--npc,#555) 45%,#000));transition:background .6s}
.np-blur{position:absolute;inset:-25%;width:150%;height:150%;object-fit:cover;filter:blur(70px) saturate(1.5);opacity:.55;transform:translateZ(0)}
.np-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.38))}
.np-in{position:relative;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 28px calc(env(safe-area-inset-bottom) + 18px);max-width:520px;margin:0 auto}
.grab{align-self:center;width:72px;height:28px;display:grid;place-items:center;flex:none}
.grab span{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.5)}
.np-artw{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:14px 0}
.np-art{width:100%;max-width:46vh;aspect-ratio:1;border-radius:13px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.42);transition:transform .55s cubic-bezier(.34,1.35,.64,1),box-shadow .55s;background:rgba(255,255,255,.1)}
.np-art img{width:100%;height:100%;object-fit:cover;display:block}
.np.paused .np-art{transform:scale(.8);box-shadow:0 10px 26px rgba(0,0,0,.3)}
.np-q{flex:1;min-height:0;overflow-y:auto;display:none;margin:10px -10px 0;padding:0 10px;-webkit-overflow-scrolling:touch}
.np.qmode .np-artw{display:none}
.np.qmode .np-q{display:block}
.np-q h3{font-size:17px;font-weight:700;margin:6px 0 8px}
.np-q .row{min-height:54px;--sl:58px}
.np-q .row::after{background:rgba(255,255,255,.14)}
.np-q .t2{color:rgba(255,255,255,.6)}
.np-q .thumb{width:44px;height:44px;background:rgba(255,255,255,.1)}
.np-q .row.on .t1{color:#fff;font-weight:600}
.np-meta{display:flex;align-items:center;gap:12px;margin-top:6px}
.np-meta .mm{flex:1;min-width:0}
.np-title{font-size:21px;font-weight:600}
.np-artist{font-size:19px;color:rgba(255,255,255,.62);margin-top:1px}
.np-more{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.np-more svg{width:18px;height:18px}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin-top:16px;cursor:pointer;--p:0%}
.seek::-webkit-slider-runnable-track{height:7px;border-radius:4px;background:linear-gradient(to right,rgba(255,255,255,.88) var(--p),rgba(255,255,255,.25) var(--p))}
.seek::-moz-range-track{height:7px;border-radius:4px;background:linear-gradient(to right,rgba(255,255,255,.88) var(--p),rgba(255,255,255,.25) var(--p))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:7px;border-radius:50%;background:transparent;border:0}
.seek::-moz-range-thumb{width:7px;height:7px;border:0;background:transparent}
.seek:active::-webkit-slider-runnable-track{height:11px;margin-top:-2px}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;margin-top:2px}
.np-ctrl{display:flex;justify-content:space-evenly;align-items:center;margin:18px 0 26px}
.cb{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .15s}
.cb:active{background:rgba(255,255,255,.14);transform:scale(.9)}
.cb svg{width:40px;height:40px}
.cb.big svg{width:54px;height:54px}
.np-bot{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.bb{width:44px;height:36px;border-radius:9px;display:grid;place-items:center;color:rgba(255,255,255,.62);position:relative;transition:background .2s,color .2s}
.bb svg{width:22px;height:22px}
.bb.on{background:rgba(255,255,255,.24);color:#fff}
.bb .one{position:absolute;right:5px;top:3px;font-size:9px;font-weight:800}

/* action sheet */
.sheetw{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheetw[hidden]{display:none}
.shbg{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s}
.sheet{position:relative;width:100%;max-width:500px;padding:0 8px calc(8px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.32,.72,0,1)}
.sheetw.show .shbg{opacity:1}
.sheetw.show .sheet{transform:none}
.shg{border-radius:14px;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px)}
.shh{display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;border-bottom:.5px solid var(--sep)}
.shh .thumb{width:44px;height:44px}
.shh .t1{font-weight:600}
.shb{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:56px;padding:0 18px;font-size:18px;color:var(--text)}
.shb+.shb{border-top:.5px solid var(--sep)}
.shb svg{width:22px;height:22px;color:var(--text2)}
.shb.red,.shb.red svg{color:#ff3b30}
.shb:active{background:var(--fill)}
.shc{margin-top:8px;width:100%;height:56px;border-radius:14px;background:var(--bg);font-weight:600;font-size:18px;color:var(--accent)}
@media (prefers-color-scheme:dark){.shc{background:#2c2c2e}}

/* toast e progresso */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 158px);transform:translate(-50%,10px);opacity:0;z-index:90;padding:11px 18px;border-radius:22px;font-size:15px;font-weight:600;transition:opacity .3s,transform .3s;white-space:nowrap;pointer-events:none;color:var(--text)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.prog{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 54px);transform:translateX(-50%);z-index:90;width:min(86vw,320px);padding:12px 16px;border-radius:16px;font-size:14px;font-weight:600}
.prog .pb{height:4px;border-radius:2px;background:var(--fill);margin-top:8px;overflow:hidden}
.prog .pb i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
input[type=file]{display:none}

/* resoconto */
.seg{display:flex;margin:0 16px 16px;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text);transition:background .2s}
.seg button.on{background:var(--bg);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
.card{margin:0 16px 14px;background:var(--bg2);border-radius:16px;padding:16px}
.clabel{font-size:13px;font-weight:600;color:var(--text2)}
.hero{font-size:52px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
.hero small{font-size:22px;font-weight:600;color:var(--text2);margin:0 4px 0 3px;letter-spacing:0}
.delta{font-size:14px;color:var(--text2);margin-top:6px}
.caption{font-size:14px;color:var(--text2);margin-top:16px;min-height:19px}
.caption b{color:var(--text);font-weight:600}
.chart{position:relative;height:140px;margin-top:22px;padding-right:46px;display:flex;align-items:flex-end;gap:2px}
.chart::after{content:"";position:absolute;left:0;right:46px;bottom:0;height:1px;background:var(--sep)}
.gl,.avg{position:absolute;left:0;right:46px;height:0;pointer-events:none}
.gl{border-top:1px solid var(--sep)}
.avg{border-top:1.5px solid var(--text3)}
.gl span,.avg span{position:absolute;left:calc(100% + 6px);transform:translateY(-55%);font-size:11px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;position:relative;z-index:1}
.bar{width:100%;max-width:24px;background:var(--accent);border-radius:4px 4px 0 0;transition:opacity .2s,height .35s}
.chart.sel .col:not(.on) .bar{opacity:.3}

/* ============ Utilità ============ */
const $ = s => document.querySelector(s);

/* ============ Database (IndexedDB) ============ */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('musica', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('tracks', { keyPath: 'id' }); d.createObjectStore('audio'); d.createObjectStore('art'); };
      r.onsuccess = () => { this.db = r.result; res(); };

  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), q = fn(t.objectStore(store));
      t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
    });
  },
  get(s, k) { return this.req(s, 'readonly', o => o.get(k)); },
  put(s, v, k) { return this.req(s, 'readwrite', o => k === undefined ? o.put(v) : o.put(v, k)); },
  del(s, k) { return this.req(s, 'readwrite', o => o.delete(k)); },
  all(s) { return this.req(s, 'readonly', o => o.getAll()); },
  keys(s) { return this.req(s, 'readonly', o => o.getAllKeys()); },
  clear(s) { return this.req(s, 'readwrite', o => o.clear()); }
};

/* ============ Stato ============ */
let TR = [];                         // metadati dei brani
const byId = new Map();
const ART = new Map();               // chiave copertina -> {url, blob, color, data}

const SET = Object.assign({ fakePause: true }, LS.get('settings', {}));
let LIBV = 0; const memo = {};
const libChanged = () => { LIBV++; refresh(); };
const savePL = () => LS.set('playlists', PL);

function memoize(n, fn) { if (memo[n] && memo[n].v === LIBV) return memo[n].r; const r = fn(); memo[n] = { v: LIBV, r }; return r; }

const albumKey = t => 'al:' + (t.albumArtist || t.artist) + '|' + t.album;
function albums() {
  return memoize('al', () => {
    const m = new Map();
    for (const t of TR) {
      if (!t.album) continue;
      const k = albumKey(t); let a = m.get(k);

}

const songsAZ = () => memoize('az', () => [...TR].sort((a, b) => coll(a.title, b.title)));

/* ============ Copertine ============ */
function ph(seed, small) { return `<div class="ph" style="--h:${hue(seed)}">${small ? '' : I.note}</div>`; }
function artFor(key, seed) { const a = key && ART.get(key); return a ? `<img src="${a.url}" alt="" loading="lazy" decoding="async">` : ph(seed); }

/* ============ Lettura tag ID3 ============ */
function leggiTag(buf) {
  const u8 = new Uint8Array(buf), out = {};
  const latin = b => { let s = ''; for (const c of b) s += String.fromCharCode(c); return s; };
  const dec = (enc, b) => {
    try {
      if (enc === 0) return latin(b);
      if (enc === 3) return new TextDecoder('utf-8').decode(b);
      let le = enc === 1;
      if (b[0] === 0xFF && b[1] === 0xFE) { le = true; b = b.subarray(2); }
      else if (b[0] === 0xFE && b[1] === 0xFF) { le = false; b = b.subarray(2); }
      return new TextDecoder(le ? 'utf-16le' : 'utf-16be').decode(b);
    } catch (e) { return ''; }
  };
  const txt = d => dec(d[0], d.subarray(1)).split('\0')[0].trim();

  const u32 = p => (u8[p] << 24 | u8[p + 1] << 16 | u8[p + 2] << 8 | u8[p + 3]) >>> 0;
  if (u8.length > 10 && u8[0] === 0x49 && u8[1] === 0x44 && u8[2] === 0x33) {
    const ver = u8[3], flags = u8[5], end = Math.min(10 + ss(6), u8.length);
    let p = 10;
    if (flags & 0x40) p += ver === 4 ? ss(10) : u32(10) + 4;
    const H = ver === 2 ? 6 : 10;
    while (p + H <= end) {
      let id, size;
      if (ver === 2) { id = latin(u8.subarray(p, p + 3)); size = u8[p + 3] << 16 | u8[p + 4] << 8 | u8[p + 5]; }
      else { id = latin(u8.subarray(p, p + 4)); size = ver === 4 ? ss(p + 4) : u32(p + 4); }
      if (!/^[A-Z0-9]{3,4}$/.test(id) || size <= 0 || p + H + size > u8.length) break;
      const d = u8.subarray(p + H, p + H + size);
      switch (id) {
        case 'TIT2': case 'TT2': out.title = txt(d); break;
        case 'TPE1': case 'TP1': out.artist = txt(d); break;
        case 'TALB': case 'TAL': out.album = txt(d); break;
        case 'TPE2': case 'TP2': out.albumArtist = txt(d); break;
        case 'TRCK': case 'TRK': out.track = parseInt(txt(d), 10) || 0; break;
        case 'APIC': case 'PIC': if (!out.pic) out.pic = leggiPic(d, ver === 2, latin); break;
      }
      p += H + size;
    }
  }
  if (!out.title && u8.length > 128) {                         // ID3v1 in fondo al file
    const t = u8.subarray(u8.length - 128);
    if (t[0] === 0x54 && t[1] === 0x41 && t[2] === 0x47) {

      if (t[125] === 0 && t[126]) out.track = out.track || t[126];
    }

}
function leggiPic(d, v2, latin) {
  try {
    const enc = d[0]; let i = 1, mime;
    if (v2) { mime = 'image/' + latin(d.subarray(1, 4)).toLowerCase(); i = 4; }
    else { const s = i; while (i < d.length && d[i] !== 0) i++; mime = latin(d.subarray(s, i)).toLowerCase() || 'image/jpeg'; i++; }
    if (!mime.includes('/')) mime = 'image/' + mime;
    mime = mime.replace('jpg', 'jpeg');
    i++;                                                     // tipo di immagine
    if (enc === 1 || enc === 2) { while (i + 1 < d.length && !(d[i] === 0 && d[i + 1] === 0)) i += 2; i += 2; }
    else { while (i < d.length && d[i] !== 0) i++; i++; }
    if (i >= d.length) return null;
    return new Blob([d.slice(i)], { type: mime });
  } catch (e) { return null; }
}
function daNomeFile(name) {
  let n = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
  n = n.replace(/^\d{1,3}\s*[.\-)]?\s+/, '');

}

  return new Promise((res, rej) => { const u = URL.createObjectURL(blob), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = e => { URL.revokeObjectURL(u); rej(e); }; i.src = u; });
}
async function ridimensiona(blob) {
  try {
    const img = await caricaImg(blob), w = img.naturalWidth, h = img.naturalHeight, s = Math.min(600, w, h), m = Math.min(w, h);
    const c = document.createElement('canvas'); c.width = c.height = s;
    const x = c.getContext('2d'); x.drawImage(img, (w - m) / 2, (h - m) / 2, m, m, 0, 0, s, s);
    const c1 = document.createElement('canvas'); c1.width = c1.height = 1;
    const x1 = c1.getContext('2d'); x1.drawImage(c, 0, 0, 1, 1);
    let [r, g, b] = x1.getImageData(0, 0, 1, 1).data;
    const L = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    if (L > 0.42) { const f = 0.42 / L; r *= f; g *= f; b *= f; }
    const out = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.86));
    return { blob: out || blob, color: `rgb(${r | 0},${g | 0},${b | 0})` };
  } catch (e) { return null; }
}
function durata(url) {
  return new Promise(res => {
    const a = new Audio(); let done = false;
    const fin = v => { if (done) return; done = true; a.removeAttribute('src'); try { a.load(); } catch (e) {} res(v); };

/* ============ Importazione ============ */
async function importa(files) {
  files = [...files].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|flac|ogg|opus)$/i.test(f.name));
  if (!files.length) { toast('Nessun file audio selezionato'); return; }

  const key = ctx('search', tr.map(t => t.id));
  let h = '';
  if (ar.length) h += `<h2 class="sec" style="padding-top:12px">Artisti</h2><div class="list">${ar.map(a => `<div class="row" data-act="push" data-v="artista" data-name="${esc(a.name)}"><div class="av">${artFor(a.artKey, a.name)}</div><div class="rt"><div class="t1 ell">${esc(a.name)}</div></div><span class="chev">${I.chevR}</span></div>`).join('')}</div>`;
  if (al.length) h += `<h2 class="sec">Album</h2><div class="hscroll">${al.map(tileAlbum).join('')}</div>`;
  if (tr.length) h += `<h2 class="sec">Brani</h2><div class="list">${tr.map((t, i) => rigaBrano(t, key, i)).join('')}</div>`;
  box.innerHTML = h || `<p class="hint">Nessun risultato per “${esc(q)}”.</p>`;
}

/* ============ Fogli d'azione, toast, progresso ============ */
let sheetRes = null, sheetT = null;
function foglio(head, items) {
  return new Promise(res => {
    sheetRes = res;
    $('#sheetIn').innerHTML = `<div class="shg">${head ? `<div class="shh">${head}</div>` : ''}${items.map((it, i) => `<button class="shb ${it.red ? 'red' : ''}" data-sh="${i}"><span>${esc(it.l)}</span>${it.i ? I[it.i] : ''}</button>`).join('')}</div><button class="shc" data-sh="-1">Annulla</button>`;
    clearTimeout(sheetT); const w = $('#sheet'); w.hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('show')));
  });
}
function chiudiFoglio(i) {
  const w = $('#sheet'); w.classList.remove('show'); clearTimeout(sheetT); sheetT = setTimeout(() => { w.hidden = true; }, 380);
  if (sheetRes) { const r = sheetRes; sheetRes = null; r(i); }
}
$('#sheet').addEventListener('click', e => { const b = e.target.closest('[data-sh]'); if (b) chiudiFoglio(+b.dataset.sh); });
let toastT;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast glass'; document.body.appendChild(t); }
  t.textContent = msg; requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
function progresso() {
  const el = document.createElement('div'); el.className = 'prog glass'; el.innerHTML = '<div class="pt"></div><div class="pb"><i></i></div>'; document.body.appendChild(el);
  return { set(txt, f) { el.querySelector('.pt').textContent = txt; el.querySelector('i').style.width = Math.round(f * 100) + '%'; }, done() { el.querySelector('i').style.width = '100%'; setTimeout(() => el.remove(), 300); } };
}

/* ============ Menu dei brani e playlist ============ */
async function menuBrano(id, ctxKey) {
  const t = byId.get(id); if (!t) return;
  const head = `<div class="thumb">${tArt(t)}</div><div class="rt" style="min-width:0"><div class="t1 ell">${esc(t.title)}</div><div class="t2 ell">${esc(t.artist)}</div></div>`;
  const items = [{ l: 'Riproduci dopo', i: 'nextUp', f: () => riproduciDopo(id) }, { l: 'Aggiungi in coda', i: 'addq', f: () => inCoda(id) }, { l: 'Aggiungi a una playlist…', i: 'addpl', f: () => scegliPlaylist(id) }];
  if (t.album) items.push({ l: "Vai all'album", i: 'albumGo', f: () => { chiudiNP(); if (TAB !== 'lib') vaiTab('lib'); push('album', { key: albumKey(t) }); } });
  if (ctxKey && ctxKey.startsWith('pl:')) items.push({ l: 'Rimuovi dalla playlist', i: 'minus', f: () => { const p = PL.find(x => 'pl:' + x.id === ctxKey); if (p) { const k = p.ids.indexOf(id); if (k >= 0) p.ids.splice(k, 1); savePL(); refresh(); } } });
  items.push({ l: 'Elimina dalla libreria', i: 'trash', red: true, f: () => { if (confirm(`Eliminare “${t.title}” dal telefono?`)) eliminaBrano(id); } });
  const i = await foglio(head, items); if (i >= 0) items[i].f();
}
async function scegliPlaylist(id) {
  const items = PL.map(p => ({ l: p.name, i: 'plist' })); items.push({ l: 'Nuova playlist…', i: 'plus' });
  const i = await foglio('<div class="t1">Aggiungi a una playlist</div>', items); if (i < 0) return;
  let p = PL[i];
  if (!p) { p = nuovaPlaylist(); if (!p) return; }
  if (p.ids.includes(id) && !confirm('Il brano è già in questa playlist. Aggiungerlo di nuovo?')) return;
  p.ids.push(id); savePL(); refresh(); toast(`Aggiunto a “${p.name}”`);
}
function nuovaPlaylist() {
  const n = (prompt('Nome della nuova playlist', '') || '').trim(); if (!n) return null;
  const p = { id: uid(), name: n, ids: [] }; PL.push(p); savePL(); refresh(); return p;
}
async function menuPlaylist() {
  const p = PL.find(x => x.id === pagina().id); if (!p) return;
  const i = await foglio(`<div class="t1">${esc(p.name)}</div>`, [{ l: 'Rinomina', i: 'edit' }, { l: 'Elimina playlist', i: 'trash', red: true }]);
  if (i === 0) { const n = (prompt('Nuovo nome', p.name) || '').trim(); if (n) { p.name = n; savePL(); render(true); } }
  if (i === 1 && confirm(`Eliminare la playlist “${p.name}”? I brani restano in libreria.`)) { PL = PL.filter(x => x !== p); savePL(); indietro(); }
}
async function eliminaBrano(id) {
  const t = byId.get(id); if (!t) return;
  if (P.cur === id) ferma();
  else {
    const k = P.queue.indexOf(id); if (k >= 0) { P.queue.splice(k, 1); if (k < P.idx) P.idx--; }
    P.orig = P.orig.filter(x => x !== id); precarica(); salvaStato();
  }
  await DB.del('audio', id).catch(() => {}); await DB.del('tracks', id).catch(() => {});
  TR = TR.filter(x => x !== t); byId.delete(id);
  PL.forEach(p => p.ids = p.ids.filter(x => x !== id)); savePL();
  if (t.artKey && !TR.some(x => x.artKey === t.artKey)) { await DB.del('art', t.artKey).catch(() => {}); const a = ART.get(t.artKey); if (a) URL.revokeObjectURL(a.url); ART.delete(t.artKey); }
  libChanged(); toast('Brano eliminato');
}
async function eliminaTutto() {
  if (!confirm('Eliminare tutti i brani dal telefono?')) return;
  if (!confirm('Sicuro? Le playlist verranno svuotate e l’operazione non si può annullare.')) return;
  ferma();
  await Promise.all(['audio', 'tracks', 'art'].map(s => DB.clear(s).catch(() => {})));
  for (const a of ART.values()) URL.revokeObjectURL(a.url);
  ART.clear(); TR = []; byId.clear(); PL.forEach(p => p.ids = []); savePL();
  TABS.lib = [{ v: 'root' }]; libChanged(); toast('Libreria svuotata');
}

/* ============ Eventi ============ */
const AZ = {
  tab: b => vaiTab(b.dataset.tab),
  back: () => indietro(),
  push: b => push(b.dataset.v, { key: b.dataset.key, name: b.dataset.name, id: b.dataset.id }),
  aggiungi: () => $('#fileIn').click(),
  play: b => { const ids = CTX[b.dataset.ctx]; if (ids) avvia(ids, +b.dataset.i); },
  playOne: b => avvia([b.dataset.id], 0, false),
  playAll: b => { const ids = CTX[b.dataset.ctx]; if (ids) avvia(ids, 0, false); },
  shufAll: b => { const ids = CTX[b.dataset.ctx]; if (ids) avvia(ids, -1, true); },
  songMenu: b => menuBrano(b.dataset.id, b.dataset.ctx),
  npMenu: () => { if (P.cur) menuBrano(P.cur, null); },
  toggle: () => toggle(),
  next: () => succ(),
  prev: () => prec(),
  shuffle: () => toggleShuffle(),
  repeat: () => toggleRepeat(),
  queue: () => { const on = np.classList.toggle('qmode'); $('#bQueue').classList.toggle('on', on); if (on) disegnaCoda(); },
  jump: b => carica(+b.dataset.i, true),
  openNP: () => apriNP(),
  closeNP: () => chiudiNP(),
  newPL: () => nuovaPlaylist(),
  plMenu: () => menuPlaylist(),
  wipe: () => eliminaTutto(),
  statK: b => { SU.k = b.dataset.k; SU.sel = null; render(true); },
  bar: b => { const i = +b.dataset.i; SU.sel = SU.sel === i ? null : i; render(true); },
  resetStats: () => { if (confirm('Azzerare tutte le statistiche di ascolto?')) { STATS = { d: {}, m: {} }; LS.set('stats', STATS); toast('Resoconto azzerato'); render(true); } }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = AZ[b.dataset.act]; if (!f) return;
  e.stopPropagation(); f(b, e);
});
document.addEventListener('input', e => { if (e.target.id === 'q') risultati(); });
document.addEventListener('change', e => {
  if (e.target.id === 'swFake') { SET.fakePause = e.target.checked; saveSET(); if (!SET.fakePause && P.fake) fermaFinta(); }
  if (e.target.id === 'fileIn') { const f = [...e.target.files]; e.target.value = ''; if (f.length) importa(f); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight' && e.altKey) succ();
  if (e.code === 'ArrowLeft' && e.altKey) prec();
});

/* ============ Avvio ============ */
document.querySelector('[data-tab="lib"]').innerHTML = I.lib + 'Libreria';
document.querySelector('[data-tab="stats"]').innerHTML = I.chart + 'Resoconto';
document.querySelector('[data-tab="cerca"]').innerHTML = I.search + 'Cerca';
document.querySelector('[data-tab="imp"]').innerHTML = I.gear + 'Impostazioni';
document.querySelector('.mini [data-act="next"]').innerHTML = I.next;
document.querySelector('.np-ctrl [data-act="prev"]').innerHTML = I.prev;
document.querySelector('.np-ctrl [data-act="next"]').innerHTML = I.next;
$('#bShuf').innerHTML = I.shuffle; $('#bQueue').innerHTML = I.queue; document.querySelector('.np-more').innerHTML = I.more;

(async () => {
  try {
    await DB.open();
    const [tracks, keys, arts] = await Promise.all([DB.all('tracks'), DB.keys('art'), DB.all('art')]);
    keys.forEach((k, i) => { const a = arts[i]; if (a && a.blob) ART.set(k, { url: URL.createObjectURL(a.blob), blob: a.blob, color: a.color }); });
    TR = tracks; TR.forEach(t => byId.set(t.id, t));
    PL.forEach(p => p.ids = p.ids.filter(id => byId.has(id)));
    const s = LS.get('player', null);
    if (s && Array.isArray(s.queue)) {
      P.queue = s.queue.filter(id => byId.has(id)); P.orig = (s.orig || s.queue).filter(id => byId.has(id));
      P.shuffle = !!s.shuffle; P.repeat = s.repeat || 'off';
      const id = s.queue[s.idx]; const i = P.queue.indexOf(id);
      if (i >= 0) await carica(i, false, s.time || 0);
    }
  } catch (e) { console.error(e); toast('Impossibile aprire la libreria'); }
  render(); ui();
})();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
